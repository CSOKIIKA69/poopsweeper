<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poopsweeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="board.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward,arrow_back_ios" />
</head>
<body>
    <a href="/index.html"><img src="img/logo.png" alt="poopsweeper-logo" class="logo" style="user-select: none;" draggable="false"></a>
    <h1 class="name"></h1>
    <main id="menu">
        <div class="dialogue" id="dialogue">
            <h2><span style="--i:1">Oh,</span> <span style="--i:2">no!</span></h2>
            <h1><span style="--i:7">Csoki</span> <span style="--i:8">has</span> <span style="--i:9">pooped</span> <span style="--i:10">all</span> <span style="--i:11">over</span> <span style="--i:12">the</span> <span style="--i:13">yard!</span></h1>
        </div>
        <button id="btn"><span class="material-symbols-outlined" onclick="forwardMenu()">arrow_forward</span></button>
        <div class="csoki-container" id="csoki-container">
            <img src="img/csoki1.png" alt="#" class="csoki" style="user-select: none" draggable="false">
        </div>
    </main>

    <section id="menu-sec">
        <div class="container-sec">
            <div class="container-bg">
                <h1>Choose a difficulty</h1>

                <button onclick="setDiff(1); forwardMenu()" id="eBtn" style="background: rgba(122, 255, 120, 0.316)" class="e">Easy</button>
                <button onclick="setDiff(2); forwardMenu()" id="mBtn" style="background: rgba(255, 181, 120, 0.316)" class="m">Medium</button>
                <button onclick="setDiff(3); forwardMenu()" id="hBtn" style="background: rgba(255, 120, 120, 0.316)" class="h">Hard</button>
            </div>
        </div>
    </section>

    <section id="game">
        <button class="backBtn" onclick="backMenu()" style="cursor: pointer"><span class="material-symbols-outlined" style="cursor: pointer">arrow_back_ios</span></button>

        <div class="game-window">
            <div class="board-header-container">
                <div class="board-header">
                    <div class="flag-number-panel">
                        <img src="img/flag.png" alt="" class="flagImg">
                        <p id="flag" class="counter">0</p>
                    </div>
                    <button onclick="restartGame()"></button>
                    <div class="time-number-panel">
                        <img src="img/clock.png" alt="" class="timeImg">
                        <p id="time" class="counter">0</p>
                    </div>
                </div>
            </div>
            <div class="board" id="board"></div>
            <div id="results-container">
                <div class="results">
                    <p>Time: <span id="result-time" style="font-weight: bold;"></span>&nbsp; sec</p>
                    <p>3BV: <span id="result-3bv"></span></p>
                    <p>3BV/s: <span id="result-3bvs"></span></p>
                    <p>Clicks: <span id="result-click"></span></p>
                    <div class="results-divider"></div>
                    <p>PB: <span id="result-pb" style="font-weight: bold"></span>&nbsp; sec</p>
                </div>
            </div>
        </div>
    </section>
    <script src="dist/long-press-event.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
